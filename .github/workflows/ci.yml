name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Check for code errors
        run: ruff check --select F src tests tools
      - name: Make sure no API key is committed
        run: |
          if grep -rEn '[0-9a-f]{40}' src tools; then
            echo "Possible Census API key found. Use the CENSUS_API_KEY environment variable."
            exit 1
          fi
      - name: Test
        run: pytest -v
